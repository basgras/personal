<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Bas Grasmayer</title>
  <link rel="icon" href="/content/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared.css" />
  <style>
    main {
      max-width: 520px;
      margin: 120px auto;
      padding: 0 20px;
      text-align: center;
    }
    h1 { font-size: 48px; margin: 0 0 12px; }
    p { font-size: 18px; }

    .lost {
      display: inline-block;
      font-size: 56px;
      line-height: 1;
      margin-bottom: 18px;
      animation: look-around 4s ease-in-out infinite;
    }

    /* Looks one way, then the other, with a little hop in between. */
    @keyframes look-around {
      0%, 30% { transform: scaleX(1); }
      38% { transform: scaleX(1) translateY(-6px); }
      42%, 72% { transform: scaleX(-1); }
      80% { transform: scaleX(-1) translateY(-6px); }
      84%, 100% { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .lost { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <span class="lost" aria-hidden="true">🐿️</span>
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <p><a href="/">Back to bas.grasmayer.com</a></p>
  </main>
</body>
</html>
